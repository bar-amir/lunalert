name: Lunalert
options:
  bundleIdPrefix: io.github.baramir
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Lunalert:
    type: application
    platform: macOS
    sources:
      - Lunalert/Sources
      - Lunalert/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.baramir.lunalert
        PRODUCT_NAME: Lunalert
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Lunalert/Info.plist
    info:
      path: Lunalert/Info.plist
      properties:
        CFBundleDisplayName: Lunalert
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: "MIT License"
        NSLocationUsageDescription: "Lunalert uses your location only to draw the real night sky above you. It never leaves your Mac."
        NSLocationWhenInUseUsageDescription: "Lunalert uses your location only to draw the real night sky above you. It never leaves your Mac."
